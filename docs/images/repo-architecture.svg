<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Claim Adjudicator — Architecture</text>

  <!-- Claimant -->
  <rect x="30" y="80" width="140" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="115" text-anchor="middle" fill="#a5b4fc" font-size="14">Claimant</text>

  <!-- Respondent -->
  <rect x="30" y="180" width="140" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="215" text-anchor="middle" fill="#fcd34d" font-size="14">Respondent</text>

  <!-- Contract -->
  <rect x="250" y="100" width="200" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="135" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">ClaimAdjudicator</text>
  <text x="350" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">file_claim()</text>
  <text x="350" y="178" text-anchor="middle" fill="#94a3b8" font-size="11">respondent_reply()</text>
  <text x="350" y="196" text-anchor="middle" fill="#94a3b8" font-size="11">close_evidence()</text>
  <text x="350" y="214" text-anchor="middle" fill="#94a3b8" font-size="11">timeout_claim()</text>
  <text x="350" y="232" text-anchor="middle" fill="#94a3b8" font-size="11">adjudicate()</text>
  <text x="350" y="250" text-anchor="middle" fill="#94a3b8" font-size="11">appeal()</text>
  <text x="350" y="275" text-anchor="middle" fill="#6ee7b7" font-size="10">5-phase lifecycle</text>

  <!-- GenLayer Consensus -->
  <rect x="530" y="100" width="230" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="645" y="130" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">GenLayer Consensus</text>
  <text x="645" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">gl.nondet.web.get()</text>
  <text x="645" y="168" text-anchor="middle" fill="#94a3b8" font-size="11">gl.nondet.exec_prompt()</text>
  <text x="645" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">gl.vm.run_nondet_unsafe()</text>

  <!-- On-chain State -->
  <rect x="530" y="240" width="230" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="645" y="270" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold">On-chain State</text>
  <text x="645" y="290" text-anchor="middle" fill="#94a3b8" font-size="11">verdict · confidence · basis</text>
  <text x="645" y="306" text-anchor="middle" fill="#94a3b8" font-size="11">score · days · rationale</text>

  <!-- Arrows -->
  <line x1="170" y1="110" x2="248" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="210" x2="248" y2="190" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="170" x2="528" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645" y1="200" x2="645" y2="238" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phases -->
  <text x="400" y="360" text-anchor="middle" fill="#64748b" font-size="12">filed → responded → evidence_closed → adjudicating → resolved</text>

  <!-- Footer -->
  <text x="400" y="420" text-anchor="middle" fill="#475569" font-size="11">Category: Builder → Intelligent Contracts</text>
  <text x="400" y="440" text-anchor="middle" fill="#475569" font-size="11">Categories: refund · return · dispute · warranty · other</text>
  <text x="400" y="460" text-anchor="middle" fill="#475569" font-size="11">Author: Longc5513 | License: MIT</text>
</svg>
